# Una sola vez (reintento): borra las versiones publicadas una a una (v1.20.0 … v1.35.0) y publica
# cuatro versiones con los grandes cambios, numeradas seguidas (1.0, 1.1, 1.2 y 1.3).
# Cada una se fabrica desde su commit, con el número nuevo dentro de la app.
name: Ordenar versiones
on:
  push:
    branches: [main]
    paths: [.github/workflows/ordenar-releases.yml]
permissions:
  contents: write
jobs:
  ordenar:
    runs-on: windows-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Borrar las versiones antiguas
        shell: bash
        run: |
          for n in $(seq 20 35); do gh release delete "v1.$n.0" --cleanup-tag -y || true; done
      - name: Fabricar y publicar 1.0, 1.1, 1.2 y 1.3
        shell: bash
        run: |
          W=$(pwd)  # rutas relativas: node, csc y bash las entienden igual en Windows
          set -E; exec > >(tee ../registro.txt) 2>&1  # si algo falla, sus últimas líneas salen como aviso en GitHub
          trap 'tail -n 12 ../registro.txt | sed "s/^/::error::/"; echo "::error::Falló: $BASH_COMMAND"' ERR
          curl -sSfL -o ../rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          CSC=/c/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe
          publicar() { # commit, versión, título, notas
            cd "$W" && rm -rf ../src ../dist && T=$(git rev-parse "$1") && git worktree add -f ../src "$T" && cd ../src
            sed -i -E "s/const VERSION = '[^']*'/const VERSION = '$2'/" server.js
            sed -i -E "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$2.0\"/" package.json
            cp ../rcedit.exe build/rcedit.exe
            node build/make-exe.js ../dist/Livalyst
            if [ -f build/bandeja.cs ]; then "$CSC" -nologo -target:winexe -codepage:65001 -win32icon:build/bandeja.ico -out:../dist/Livalyst/LivalystBandeja.exe build/bandeja.cs; fi
            cp server.js panel.html widgets.html overlay.html package.json package-lock.json ../dist/Livalyst/
            cp -r logos ../dist/Livalyst/
            (cd ../dist/Livalyst && npm ci --omit=dev --silent)
            (cd ../dist && pwsh -c "Compress-Archive -Path Livalyst -DestinationPath Livalyst.zip")
            gh release create "v$2.0" ../dist/Livalyst.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$3" --notes "$4

          **Cómo usarlo:** descarga Livalyst.zip, descomprímelo y abre Livalyst.exe. No hace falta instalar nada."
            cd "$W" && git worktree remove -f ../src
          }
          publicar fca0261 1.0 "Livalyst 1.0 — Versión portable" "- Livalyst.exe: se abre con doble clic, sin instalar nada.
          - Icono nuevo.
          - Chat con nuevo diseño: los eventos se ven como entradas, la sala muestra a cada persona con el color de su plataforma y los mensajes destacados son más limpios."
          sleep 5
          publicar 0563c05 1.1 "Livalyst 1.1 — Animaciones" "- Alertas con animaciones Lottie (descárgalas gratis en lottiefiles.com).
          - La página de widgets se abre y cambia de pestaña con animaciones suaves."
          sleep 5
          publicar bc86a61 1.2 "Livalyst 1.2 — Icono en la bandeja y diseño pulido" "- Icono de Livalyst junto al reloj de Windows: clic derecho para abrir la configuración o cerrar Livalyst.
          - Página de widgets revisada: mismos tamaños, filas simétricas, colores más claros y direcciones para OBS completas."
          sleep 5
          publicar "$GITHUB_SHA" 1.3 "Livalyst 1.3 — Editar el directo" "- Botón ✏️ en el chat: cambia el título y la categoría de Twitch, con buscador del catálogo oficial de Twitch.
          - Botón para abrir TikTok LIVE Monitor en tu navegador predeterminado."
