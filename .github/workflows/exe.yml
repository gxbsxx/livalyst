# Fabrica la versión portable para Windows (carpeta con Livalyst.exe, sin instalar nada) y comprueba que arranca.
# Cuando sube la versión de package.json, la publica sola en «Releases» para descargarla.
name: Livalyst.exe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fabricar Livalyst.exe
        shell: bash
        run: |
          curl -sSfL -o build/rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          node build/make-exe.js dist/Livalyst
      - name: Fabricar el icono de la bandeja
        shell: pwsh
        run: |
          $o = & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 /win32icon:build\bandeja.ico /out:dist\Livalyst\LivalystBandeja.exe build\bandeja.cs 2>&1
          if ($LASTEXITCODE -ne 0) { $o | ForEach-Object { "::error::$_" }; throw "No se pudo compilar el icono de la bandeja" }
      - name: Montar la carpeta portable
        shell: bash
        run: |
          cp server.js panel.html widgets.html overlay.html package.json package-lock.json "Comprobar Livalyst.bat" dist/Livalyst/
          cp -r logos dist/Livalyst/
          cd dist/Livalyst && npm ci --omit=dev
      - name: Comprobar que arranca, responde y no abre ventana negra
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist/Livalyst/Livalyst.exe"); $pe = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b, $pe + 92) -ne 2) { throw "Livalyst.exe abriría una consola" }
          Start-Process dist/Livalyst/Livalyst.exe -WorkingDirectory dist/Livalyst
          Start-Sleep 8
          $r = Invoke-WebRequest http://localhost:8787/config -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "Livalyst no responde" }
          Get-Content dist/Livalyst/livalyst.log
          if (-not (Get-Process LivalystBandeja -ErrorAction SilentlyContinue)) { throw "No aparece el icono de la bandeja" }
          # «Comprobar Livalyst.bat» con Livalyst abierto: todo bien (código 0); la salida queda como aviso en GitHub
          Copy-Item "dist/Livalyst/Comprobar Livalyst.bat" dist/Livalyst/comprobar.bat  # mismo sitio, nombre sin espacios
          $o = '' | cmd /c dist\Livalyst\comprobar.bat; $c = $LASTEXITCODE; $o | ForEach-Object { "::notice::abierto: $_" }
          if ($c -ne 0 -or -not ($o -match 'Todo funciona correctamente')) { throw "Comprobar Livalyst.bat da fallos con Livalyst abierto" }
          Invoke-WebRequest -Method POST http://localhost:8787/quit -UseBasicParsing | Out-Null
          Start-Sleep 12
          if (Get-Process LivalystBandeja -ErrorAction SilentlyContinue) { throw "El icono de la bandeja no se quita al cerrar Livalyst" }
          # y con Livalyst cerrado: los archivos bien y un aviso de que no está abierto
          $o = '' | cmd /c dist\Livalyst\comprobar.bat; $c = $LASTEXITCODE; $o | ForEach-Object { "::notice::cerrado: $_" }
          if ($c -ne 0 -or -not ($o -match 'Livalyst no est.{1,3} abierto')) { throw "Comprobar Livalyst.bat no avisa de que Livalyst está cerrado" }
          Remove-Item dist/Livalyst/comprobar.bat
          Remove-Item dist/Livalyst/livalyst.log -ErrorAction SilentlyContinue
      - name: Comprimir (carpeta Livalyst dentro del zip)
        shell: pwsh
        run: Compress-Archive -Path dist/Livalyst -DestinationPath dist/Livalyst.zip
      - uses: actions/upload-artifact@v4
        with: { name: Livalyst-portable, path: dist/Livalyst.zip }
      - name: Publicar en Releases (solo si la versión es nueva)
        if: "!contains(github.event.head_commit.message, '[ordenar]')" # ese cambio publica sus versiones con «Ordenar versiones»
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="v$(node -p "require('./package.json').version")"
          # título y explicación: los del commit si empieza por «Livalyst 1.N …» (primera línea y resto)
          git log -1 --format=%s > ../titulo.txt; { git log -1 --format=%b | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' || true; } > ../notas.txt
          printf '\n**Cómo usarlo:** descarga Livalyst.zip, descomprímelo y abre Livalyst.exe. No hace falta instalar nada.\n' >> ../notas.txt
          S=${V#v}; S=${S%.0}  # 1.4.0 → 1.4, como en el título del commit
          T=$(cat ../titulo.txt); case "$T" in "Livalyst $S "*) ;; *) T="Livalyst $V";; esac
          if gh release view "$V" > /dev/null 2>&1; then
            # ya publicada: si este commit es el de la versión, pone al día su título y explicación
            if [ "$T" != "Livalyst $V" ]; then gh release edit "$V" --title "$T" --notes-file ../notas.txt; fi
            echo "$V ya estaba publicada"; exit 0
          fi
          gh release create "$V" dist/Livalyst.zip --target "$GITHUB_SHA" --title "$T" --notes-file ../notas.txt
