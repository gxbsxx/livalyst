# Fabrica la versión portable para Windows (carpeta con Livalyst.exe, sin instalar nada) y comprueba que arranca.
# Con cada etiqueta vX.Y.Z la publica en «Releases» para descargarla.
name: Livalyst.exe
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fabricar Livalyst.exe
        run: node build/make-exe.js dist/Livalyst
      - name: Montar la carpeta portable
        shell: bash
        run: |
          cp server.js panel.html widgets.html overlay.html package.json package-lock.json dist/Livalyst/
          cp -r logos dist/Livalyst/
          cd dist/Livalyst && npm ci --omit=dev
      - name: Comprobar que arranca, responde y no abre ventana negra
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist/Livalyst/Livalyst.exe"); $pe = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b, $pe + 92) -ne 2) { throw "Livalyst.exe abriría una consola" }
          Start-Process dist/Livalyst/Livalyst.exe -WorkingDirectory dist/Livalyst
          Start-Sleep 8
          $r = Invoke-WebRequest http://localhost:8787/config -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "Livalyst no responde" }
          Get-Content dist/Livalyst/livalyst.log
          Invoke-WebRequest -Method POST http://localhost:8787/quit -UseBasicParsing | Out-Null
          Start-Sleep 2
          Remove-Item dist/Livalyst/livalyst.log -ErrorAction SilentlyContinue
      - name: Comprimir (carpeta Livalyst dentro del zip)
        shell: pwsh
        run: Compress-Archive -Path dist/Livalyst -DestinationPath dist/Livalyst.zip
      - uses: actions/upload-artifact@v4
        with: { name: Livalyst-portable, path: dist/Livalyst.zip }
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/Livalyst.zip --title "Livalyst $GITHUB_REF_NAME" --notes "Descarga Livalyst.zip, descomprímelo y abre Livalyst.exe. No hace falta instalar nada."
