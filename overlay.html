<!doctype html>
<html lang="es" data-theme="custom">
<head>
<meta charset="utf-8">
<title>Livalyst</title>
<!-- Fuente de navegador de OBS: http://localhost:8787/alertas  ó  http://localhost:8787/meta?t=likes|follows|diamonds|shares -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: var(--font, system-ui), system-ui, sans-serif; }
  #a { position: fixed; inset: 0; text-align: center; }
  .al { position: relative; display: flex; flex-direction: column; align-items: center; gap: .35em; box-sizing: border-box; max-width: 16em; min-width: min-content; /* min-width gana: un nombre largo ensancha la tarjeta en vez de partirse */
    text-wrap: balance; font-size: var(--size); color: var(--color);
    font-weight: 800; line-height: 1.15; text-shadow: 0 2px 8px #000c, 0 0 3px #000; }
  .al img, .al video { max-width: 70vw; max-height: 55vh; }
  .al .lot { width: min(42vh, 60vw); aspect-ratio: 1; } /* animación Lottie */
  .al .pic { width: 2.8em; height: 2.8em; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 .12em var(--accent); }
  .al .gi { width: 2.8em; height: 2.8em; object-fit: contain; }
  .al .emo { font-size: 2.4em; }
  .al b { color: var(--accent); white-space: nowrap; }
  .pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); } @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .slide { animation: slide .5s ease-out; } @keyframes slide { from { transform: translateY(60vh); opacity: 0; } }
  .fade { animation: fade .6s; } @keyframes fade { from { opacity: 0; } }
  .drop { animation: drop .7s cubic-bezier(.3, 1.5, .5, 1); } @keyframes drop { from { transform: translateY(-80vh) rotate(-8deg); } }
  .spin { animation: spin .7s cubic-bezier(.2, 1.2, .4, 1); } @keyframes spin { from { transform: rotate(-540deg) scale(0); } }
  .zoom { animation: zoom .45s ease-out; } @keyframes zoom { from { transform: scale(3); opacity: 0; filter: blur(8px); } }
  .out { transition: opacity .4s, transform .4s; opacity: 0; transform: scale(.9); }

  #fit { position: absolute; left: 50%; top: 50%; width: max-content; transform: translate(-50%, -50%); }
  #g { box-sizing: border-box; margin: 6px; padding: .5em .8em .65em; border-radius: .6em; font-size: var(--gsize); color: var(--gtext); background: var(--gbg);
    font-weight: 700; text-shadow: 0 1px 3px #0009; }
  #g .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; margin-bottom: .35em; white-space: nowrap; }
  #g .row span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #g .row span:last-child { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  #g.top .row.pos { margin: .2em 0 0; font-size: .85em; }
  #g.top .row.pos span:first-child { text-align: left; }
  #g.top .row.pos:nth-child(2) { font-weight: 800; }
  #g .bar { height: .75em; border-radius: 1em; background: #ffffff2e; overflow: hidden; }
  #g .fill { height: 100%; width: 0; border-radius: inherit; background: var(--gc); transition: width .7s cubic-bezier(.2, .9, .3, 1); }
  #g.done .fill { animation: glow 1.2s ease-in-out infinite alternate; } @keyframes glow { to { filter: brightness(1.5); } }

  /* partículas: se dibujan en un lienzo encima de todo */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

  /* ============ TEMAS (con tema "custom" se usan tus colores y fuente) ============ */
  :where(:root:not([data-theme=custom])) .al { padding: .6em 1em; border-radius: .5em; } /* :where = sin peso, así cada tema puede cambiar forma y relleno */

  /* 👾 Arcade 8 bits */
  [data-theme=retro] .al { background: #000; color: #fff; border-radius: 0; text-shadow: .12em .12em 0 #e4002b; font-size: calc(var(--size) * .6); line-height: 1.7;
    box-shadow: 0 0 0 .2em #fff, 0 0 0 .4em #000, 0 0 0 .6em #ffd400; }
  [data-theme=retro] .al b { color: #ffd400; animation: blink8 .6s steps(1) infinite; }
  [data-theme=retro] .al .pic, [data-theme=retro] .al .gi { border-radius: 0; image-rendering: pixelated; box-shadow: 0 0 0 .15em #fff; }
  @keyframes blink8 { 50% { color: #fff; } }
  [data-theme=retro] #g { background: #000; color: #fff; border-radius: 0; text-shadow: 2px 2px 0 #e4002b; font-size: calc(var(--gsize) * .7);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px #000; margin: 10px; }
  [data-theme=retro] #g .bar { border-radius: 0; background: #222; height: 1em; }
  [data-theme=retro] #g .fill { border-radius: 0; background: repeating-linear-gradient(90deg, var(--gc) 0 .8em, transparent .8em 1em); }

  /* 🌴 Vaporwave */
  [data-theme=vaporwave] .al { background: linear-gradient(180deg, #ff71ce, #b967ff 55%, #01cdfe); color: #fff; border-radius: .2em; font-style: italic;
    text-shadow: .08em .08em 0 #6a2c91, 0 0 2px #000; box-shadow: .25em .25em 0 #05ffa1; }
  [data-theme=vaporwave] .al b { color: #fffb96; }
  [data-theme=vaporwave] #g { background: linear-gradient(90deg, #2d0b4ee6, #4a1475e6); color: #fffb96; border: 2px solid #ff71ce; border-radius: .2em;
    font-style: italic; box-shadow: 4px 4px 0 #05ffa1; }
  [data-theme=vaporwave] #g .fill { background: linear-gradient(90deg, #ff71ce, #01cdfe, #05ffa1); }

  /* 🫧 Cristal */
  [data-theme=glass] .al { background: #ffffff24; backdrop-filter: blur(14px) saturate(1.4); border: 1px solid #ffffff66; border-radius: 1em; color: #fff;
    box-shadow: 0 8px 30px #0005; font-weight: 600; }
  [data-theme=glass] .al b { background: linear-gradient(90deg, #ffb3e6, #b3e0ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; font-weight: 800; }
  [data-theme=glass] .al .pic { box-shadow: 0 0 0 .08em #fff; }
  [data-theme=glass] #g { background: #ffffff24; backdrop-filter: blur(14px); border: 1px solid #ffffff66; border-radius: 1em; color: #fff; font-weight: 600; }
  [data-theme=glass] #g .bar { background: #ffffff33; }
  [data-theme=glass] #g .fill { background: linear-gradient(90deg, #ffffffcc, var(--gc)); }

  /* 🔥 Fuego */
  [data-theme=fire] .al { background: radial-gradient(ellipse at bottom, #ff5a00d9, #3a0000eb 70%); color: #ffe7a3; text-transform: uppercase; letter-spacing: .03em;
    font-weight: 400; text-shadow: 0 0 4px #ff9a00, 0 -2px 10px #ff3d00, 0 -6px 20px #ff3d0088; }
  [data-theme=fire] .al b { color: #fff; animation: burn 1.1s ease-in-out infinite alternate; }
  @keyframes burn { to { text-shadow: 0 0 6px #fff6, 0 -4px 14px #ff9a00, 0 -12px 28px #ff3d00; } }
  [data-theme=fire] .al .pic { box-shadow: 0 0 0 .1em #ff9a00, 0 0 20px #ff3d00; }
  [data-theme=fire] #g { background: #1a0500eb; color: #ffe7a3; text-transform: uppercase; letter-spacing: .04em; font-weight: 400; border: 1px solid #ff5a0066; }
  [data-theme=fire] #g .fill { background: linear-gradient(90deg, #ff1e00, #ff7b00, #ffd000, #ff7b00, #ff1e00) 0 0 / 200% 100%; animation: lava 2s linear infinite;
    box-shadow: 0 0 12px #ff5a00; }
  @keyframes lava { to { background-position: 200% 0; } }

  /* 🧊 Hielo */
  [data-theme=ice] .al { background: linear-gradient(160deg, #effcffee, #a9e6ffd9); color: #0b4a6f; border: 1px solid #fff; border-radius: .8em;
    text-shadow: 0 1px 0 #fff; box-shadow: 0 0 22px #8fe3ff, inset 0 0 18px #fff; font-weight: 700; }
  [data-theme=ice] .al b { color: #0077b6; }
  [data-theme=ice] .al .pic { box-shadow: 0 0 0 .1em #fff, 0 0 16px #8fe3ff; }
  [data-theme=ice] #g { background: #effcffe6; color: #0b4a6f; border-radius: .8em; text-shadow: none; box-shadow: 0 0 14px #8fe3ff; }
  [data-theme=ice] #g .bar { background: #c9f1ff; }
  [data-theme=ice] #g .fill { background: linear-gradient(90deg, #48cae4, #e0fbff, #48cae4) 0 0 / 200% 100%; animation: lava 3s linear infinite; }

  /* ⚪ Minimalista */
  [data-theme=minimal] .al { background: #fff; color: #111; border-radius: .4em; text-shadow: none; box-shadow: 0 10px 30px #0004; font-weight: 600; }
  [data-theme=minimal] .al b { color: #111; font-weight: 800; box-shadow: inset 0 -.32em 0 #fe2c5566; }
  [data-theme=minimal] .al .pic { box-shadow: none; }
  [data-theme=minimal] #g { background: #fff; color: #111; text-shadow: none; border-radius: .4em; box-shadow: 0 4px 14px #0003; }
  [data-theme=minimal] #g .bar { background: #eee; height: .45em; }
  [data-theme=minimal] #g .fill { background: #111; }

  /* 🌿 Bosque */
  [data-theme=forest] .al { background: linear-gradient(#1f3d2bee, #0f2418ee); color: #e8f5d0; border: 2px solid #7fb069; border-radius: .6em .1em .6em .1em;
    text-shadow: 0 2px 4px #000a; font-weight: 700; }
  [data-theme=forest] .al::before { content: '🍃'; position: absolute; top: -.6em; left: -.4em; font-size: .9em; animation: bob 2s ease-in-out infinite; }
  [data-theme=forest] .al b { color: #c5e86c; }
  @keyframes bob { 50% { transform: translateY(-.12em) rotate(-3deg); } }
  [data-theme=forest] #g { background: #12291ceb; color: #e8f5d0; border: 2px solid #7fb069; border-radius: .6em .1em .6em .1em; }
  [data-theme=forest] #g .fill { background: linear-gradient(90deg, #4c956c, #c5e86c); }

  /* ================= TEMAS CREATIVOS (formas y conceptos) ================= */

  /* 🎟️ Entrada de cine: muescas laterales y línea perforada */
  [data-theme=ticket] .al { background: #fff4d6; color: #3b2a1a; text-shadow: none; border-radius: .3em; padding: .6em 1.6em .7em;
    text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
    -webkit-mask: radial-gradient(circle .6em at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle .6em at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle .6em at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle .6em at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat; }
  [data-theme=ticket] .al::before { content: 'Entrada · En directo'; font-size: .38em; letter-spacing: .3em; color: #c0392b; }
  [data-theme=ticket] .al div { border-top: .1em dashed #c9a96e; padding-top: .3em; }
  [data-theme=ticket] .al b { color: #c0392b; }
  [data-theme=ticket] .al .pic { box-shadow: 0 0 0 .1em #c0392b; }
  [data-theme=ticket] #g { background: #fff4d6; color: #3b2a1a; text-shadow: none; border-radius: .2em; text-transform: uppercase; letter-spacing: .04em; padding: .5em 1.4em .65em;
    -webkit-mask: radial-gradient(circle .45em at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle .45em at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle .45em at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle .45em at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat; }
  [data-theme=ticket] #g .bar { border-radius: 0; background: repeating-linear-gradient(90deg, #e8d5a8 0 .4em, #0000 .4em .6em); }
  [data-theme=ticket] #g .fill { border-radius: 0; background: #c0392b; }

  /* 📺 Tele antigua: pantalla de tubo curvada con barrido */
  [data-theme=crt] .al { background: radial-gradient(ellipse at center, #1d4a33, #0a1710 75%); color: #b8ffcf; border-radius: 1.4em / 1.8em; border: .35em solid #2a2a2a;
    box-shadow: 0 0 0 .1em #5a5a5a, inset 0 0 1.2em #000, 0 0 1.4em #3dff8a44; text-shadow: 0 0 .25em #6dffa8; font-weight: 400; overflow: hidden; padding: .8em 1.4em; }
  [data-theme=crt] .al::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(0deg, #0000 0 2px, #0006 2px 4px), radial-gradient(ellipse at center, #0000 55%, #0008); }
  [data-theme=crt] .al div { animation: crtflick 4s infinite; }
  @keyframes crtflick { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .55; transform: translateX(.04em); } 98% { opacity: .9; } }
  [data-theme=crt] .al b { color: #fff; text-shadow: 0 0 .3em #6dffa8; }
  [data-theme=crt] .al .pic { box-shadow: 0 0 0 .08em #6dffa8; filter: saturate(.6) sepia(.3) hue-rotate(60deg); }
  [data-theme=crt] #g { background: #0d1f15; color: #b8ffcf; border: .2em solid #2a2a2a; border-radius: .6em; text-shadow: 0 0 .25em #6dffa8; font-weight: 400; }
  [data-theme=crt] #g .bar { border-radius: .1em; background: #06120b; height: .8em; }
  [data-theme=crt] #g .fill { border-radius: 0; background: repeating-linear-gradient(90deg, #3dff8a 0 .45em, #0000 .45em .6em); filter: drop-shadow(0 0 .2em #3dff8a); }

  /* 📸 Polaroid: foto instantánea ladeada con celo */
  [data-theme=polaroid] .al { background: #fafafa; color: #2b2b2b; padding: .55em .55em 1.1em; border-radius: .08em; box-shadow: 0 .4em 1em #0009; transform: rotate(-3deg); text-shadow: none; font-weight: 400; }
  [data-theme=polaroid] .al > :first-child { background: linear-gradient(135deg, #2c3e50, #4a6278); padding: .45em 1.6em; align-self: stretch; text-align: center; }
  [data-theme=polaroid] .al::before { content: ''; position: absolute; top: -.4em; left: 50%; width: 3.2em; height: .85em; transform: translateX(-50%) rotate(3deg);
    background: #f5e6a8cc; box-shadow: 0 .05em .15em #0003; }
  [data-theme=polaroid] .al b { color: #d6336c; }
  [data-theme=polaroid] .al .pic { box-shadow: none; }
  [data-theme=polaroid] #g { background: #f5e6a8; color: #2b2b2b; text-shadow: none; border-radius: .1em; transform: rotate(-1deg); box-shadow: 0 .15em .4em #0005; font-weight: 400; margin: 10px; }
  [data-theme=polaroid] #g .bar { background: #e2cf86; }
  [data-theme=polaroid] #g .fill { background: #d6336c; }

  /* 🗡️ Diálogo RPG: cuadro de texto de videojuego clásico */
  [data-theme=rpg] .al { background: linear-gradient(#22319a, #0b134d); color: #fff; border: .14em solid #fff; outline: .14em solid #0b134d; border-radius: .35em;
    text-shadow: .07em .07em 0 #000; font-weight: 400; text-align: left; align-items: flex-start; padding: .7em 1.2em 1em; }
  [data-theme=rpg] .al::after { content: '▼'; position: absolute; right: .6em; bottom: .25em; font-size: .5em; animation: rpgblink .8s steps(1) infinite; }
  @keyframes rpgblink { 50% { opacity: 0; } }
  [data-theme=rpg] .al b { color: #ffe066; }
  [data-theme=rpg] .al .pic { border-radius: .15em; box-shadow: 0 0 0 .1em #fff; }
  [data-theme=rpg] #g { background: #0b134d; color: #fff; border: .12em solid #fff; outline: .12em solid #0b134d; border-radius: .3em; text-shadow: .06em .06em 0 #000; font-weight: 400; margin: 8px; }
  [data-theme=rpg] #g .row span:first-child::before { content: 'HP '; color: #ffe066; }
  [data-theme=rpg] #g .bar { border-radius: 0; background: #3a0d12; border: .1em solid #fff; height: .85em; }
  [data-theme=rpg] #g .fill { border-radius: 0; background: linear-gradient(#9dff5e, #2e9b00); }

  /* 🧾 Ticket de caja: recibo térmico con borde de sierra */
  [data-theme=receipt] .al { background: #fbfbf8; color: #222; text-shadow: none; border-radius: 0; padding: .8em 1.4em 1.4em; font-weight: 700; text-transform: uppercase;
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / .8em 100%;
            mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / .8em 100%; }
  [data-theme=receipt] .al::before { content: '*** Livalyst ***'; font-size: .42em; letter-spacing: .25em; color: #666; }
  [data-theme=receipt] .al div { border-top: .08em dashed #999; padding-top: .3em; }
  [data-theme=receipt] .al b { color: #000; }
  [data-theme=receipt] .al img { filter: grayscale(1) contrast(1.2); }
  [data-theme=receipt] .al .pic { box-shadow: none; }
  [data-theme=receipt] #g { background: #fbfbf8; color: #222; text-shadow: none; border-radius: 0; text-transform: uppercase; padding-bottom: 1em;
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / .6em 100%;
            mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / .6em 100%; }
  [data-theme=receipt] #g .row span:first-child { flex: 1; background: radial-gradient(circle, #999 .06em, #0000 .07em) 0 85% / .35em .35em repeat-x; }
  [data-theme=receipt] #g .bar { border-radius: 0; height: .9em; background: repeating-linear-gradient(90deg, #ddd 0 1px, #0000 1px 3px); }
  [data-theme=receipt] #g .fill { border-radius: 0; background: repeating-linear-gradient(90deg, #111 0 2px, #0000 2px 3px, #111 3px 4px, #0000 4px 7px); }

  /* 🪐 Órbita: insignia redonda con un planeta orbitando */
  [data-theme=orbit] .al { background: radial-gradient(circle at 30% 30%, #2f2466, #0a0820 70%); color: #e8e4ff; border-radius: 50%; aspect-ratio: 1; justify-content: center;
    padding: 1.4em; box-shadow: 0 0 1.4em #6a4cff66; }
  [data-theme=orbit] .al::before { content: ''; position: absolute; inset: -.45em; border-radius: 50%; border: .07em dashed #9d8cff; animation: orbitspin 8s linear infinite;
    background: radial-gradient(circle at 50% 0, #ffd36e .22em, #ffd36e66 .3em, #0000 .4em); }
  @keyframes orbitspin { to { transform: rotate(360deg); } }
  [data-theme=orbit] .al b { color: #ffd36e; }
  [data-theme=orbit] .al .pic { box-shadow: 0 0 0 .08em #9d8cff, 0 0 .8em #6a4cff; }
  [data-theme=orbit] #g { background: radial-gradient(ellipse at 20% 0, #2f2466, #0a0820 80%); color: #e8e4ff; border-radius: 99em; padding: .5em 1.2em .7em; text-shadow: none; }
  [data-theme=orbit] #g .bar { overflow: visible; background: #1c1640; }
  [data-theme=orbit] #g .fill { position: relative; background: linear-gradient(90deg, #6a4cff, #ff9f43); }
  [data-theme=orbit] #g .fill::after { content: ''; position: absolute; right: -.45em; top: 50%; width: 1.1em; height: 1.1em; transform: translateY(-50%); border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9a8, #ff9f43); box-shadow: 0 0 .6em #ff9f43; }

  /* 🧱 Bloques de construcción: pieza con botones */
  [data-theme=brick] .al { background: #e3262f; color: #fff; border-radius: .25em; padding: .9em 1.4em .7em; margin-top: .5em; text-shadow: 0 .06em 0 #a5161d;
    box-shadow: inset 0 -.25em 0 #a5161d, inset 0 .12em 0 #ff6b72, 0 .3em .6em #0006; }
  [data-theme=brick] .al::before { content: ''; position: absolute; left: .5em; right: .5em; top: -.42em; height: .45em;
    background: radial-gradient(ellipse at 50% 100%, #ff5a62 .34em, #b81a22 .35em .42em, #0000 .43em) 0 0 / 1.3em 100% space; }
  [data-theme=brick] .al b { color: #ffe14d; }
  [data-theme=brick] .al .pic { box-shadow: 0 0 0 .1em #ffe14d; }
  [data-theme=brick] #g { background: #f7c600; color: #4a3500; text-shadow: none; border-radius: .2em; margin-top: 14px; box-shadow: inset 0 -.2em 0 #c49b00, 0 .2em .4em #0005; }
  [data-theme=brick] #g::before { content: ''; position: absolute; left: .5em; right: .5em; top: -.35em; height: .38em;
    background: radial-gradient(ellipse at 50% 100%, #ffd84a .28em, #c49b00 .29em .35em, #0000 .36em) 0 0 / 1.1em 100% space; }
  [data-theme=brick] #g { position: relative; }
  [data-theme=brick] #g .bar { background: #c49b00; border-radius: .1em; }
  [data-theme=brick] #g .fill { border-radius: .1em; background: repeating-linear-gradient(90deg, #e3262f 0 1.5em, #a5161d 1.5em 1.6em); }


  /* ================= MEJORAS v1.4 (se aplican encima de cada tema) ================= */
  /* Sombra para los temas recortados (la máscara se comería un box-shadow normal) */
  [data-theme=ticket] #a, [data-theme=receipt] #a { filter: drop-shadow(0 .25em .35em #0008); }
  /* Todo lo decorativo va por detrás del contenido */
  :where([data-theme=vaporwave], [data-theme=glass], [data-theme=ice], [data-theme=crt]) .al > * { position: relative; z-index: 1; }

  /* 👾 Arcade: esquinas pixeladas, marco de tres colores por dentro y «PLAYER 1» */
  [data-theme=retro] .al { box-shadow: inset 0 0 0 .18em #fff, inset 0 0 0 .36em #000, inset 0 0 0 .54em #ffd400; padding: 1.2em 1.6em;
    clip-path: polygon(0 .36em, .36em .36em, .36em 0, calc(100% - .36em) 0, calc(100% - .36em) .36em, 100% .36em, 100% calc(100% - .36em),
      calc(100% - .36em) calc(100% - .36em), calc(100% - .36em) 100%, .36em 100%, .36em calc(100% - .36em), 0 calc(100% - .36em)); }

  stars: '⭐🌟✨🪐', candy: '🍬🍭🍫', leaves: '🍃🍂🌿', money: '💸💵' };
const FALLING = new Set(['snow', 'matrix', 'leaves', 'money']); // estas caen desde arriba en vez de explotar
const WEIGHTS = { Roboto: '400;700;900', Montserrat: '400;700;900', Poppins: '400;700;900', Nunito: '400;700;900', Inter: '400;700;900', Orbitron: '400;700;900',
  Cinzel: '400;700;900', Oswald: '400;700', 'Courier Prime': '400;700', Syne: '400;700', Caveat: '400;700', 'Space Grotesk': '400;700', Fredoka: '400;700', Quicksand: '400;700' }; // las demás solo tienen 400 (pedir más hace fallar a Google Fonts)
const root = document.documentElement, box = document.getElementById('a');
let cfg = null, stats = {}, queue = [], busy = false, wasDone = null, hideTimer, goalFrame = 0;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const media = n => '/media/' + encodeURIComponent(n);
const pick = s => { const a = [...s]; return a[Math.random() * a.length | 0]; };
function loadFont(f) {
  if (!f || f === 'system') return root.style.removeProperty('--font');
  root.style.setProperty('--font', `"${f}"`);
  if (loadFont.done?.has(f)) return;
  (loadFont.done ??= new Set()).add(f);
  const l = el('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + f.replace(/ /g, '+') + (WEIGHTS[f] ? ':wght@' + WEIGHTS[f] : '') + '&display=swap';
  document.head.append(l);
}
// Aplica tema: con "custom" tu fuente y colores; con otro, los del tema. Devuelve el efecto que toca.
function theme(s, vars) {
  const t = THEMES[s.theme] ? s.theme : 'custom';
  root.dataset.theme = t;
  loadFont(t === 'custom' ? s.font : THEMES[t][0]);
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);
  if (s.fxOn === false) return 'none'; // interruptor «Efectos» apagado
  return s.fx === 'theme' ? (THEMES[t]?.[1] || 'confetti') : s.fx;
}
// ---------- partículas con física: gravedad, rozamiento, giro y aleteo de papel ----------
// Todo va en proporción al tamaño de la fuente de OBS, así se ve igual en una fuente grande que en una pequeña.
const COLORS = ['#fe2c55', '#25f4ee', '#ffd400', '#8b5cf6', '#22c55e', '#ff8a00', '#ffffff', '#ff6ec7'];
const canvas = el('canvas'); canvas.id = 'fx'; document.body.append(canvas);
const ctx = canvas.getContext('2d');
let parts = [], raf = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
function frame() {
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life > 0 && p.y < H + 80);
  for (const p of parts) {
    if (p.delay-- > 0) continue;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
    p.x += p.vx + Math.sin(p.t * p.wob) * p.sway; p.y += p.vy;
    p.rot += p.vr; p.t++; p.life--;
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life / 40);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.ch) {
      ctx.font = `${p.s}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (p.glow) { ctx.fillStyle = p.glow; ctx.shadowColor = p.glow; ctx.shadowBlur = 8; }
      ctx.fillText(p.ch, 0, 0);
    } else {
      ctx.scale(1, Math.cos(p.t * p.flip));           // el papel da la vuelta al caer
      ctx.fillStyle = p.c;
      if (p.shape === 0) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);                  // papelito
      else if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.s / 3, 0, 7); ctx.fill(); } // lentejuela
      else ctx.fillRect(-p.s / 10, -p.s, p.s / 5, p.s * 2);                               // serpentina
    }
    ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(frame) : (ctx.clearRect(0, 0, W, H), 0);
}
function add(p) { parts.push({ t: 0, rot: rnd(0, 6.3), drag: .985, sway: 0, wob: .1, flip: rnd(.08, .2), delay: 0, ...p }); }
// Explosión de efectos: confeti con cañones desde las esquinas + estallido central; el resto, emojis.
function burst(kind, n) {
  if (!kind || kind === 'none') return;
  const W = innerWidth, H = innerHeight, u = Math.min(W, H) / 100; // 1u = 1 % del lado corto
  if (kind === 'confetti') {
    n = n || 140;
    for (let i = 0; i < n; i++) {
      const side = i % 3, s = rnd(2.2, 3.8) * u, base = { c: pick(COLORS), shape: Math.random() < .55 ? 0 : Math.random() < .6 ? 1 : 2, s,
        g: .04 * u, drag: rnd(.975, .99), vr: rnd(-.2, .2), wob: rnd(.05, .12), sway: rnd(.1, .4) * u / 3, life: rnd(220, 320) | 0, delay: rnd(0, 8) | 0 };
      if (side === 2) { // estallido desde el centro
        const a = rnd(0, Math.PI * 2), v = rnd(1.2, 3.2) * u;
        add({ ...base, x: W / 2, y: H / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2 * u });
      } else {        // cañones desde las esquinas de abajo, hacia el centro y hacia arriba
        const dir = side === 0 ? 1 : -1, a = rnd(55, 80) * Math.PI / 180, v = rnd(3.2, 5.2) * u;
        add({ ...base, x: side === 0 ? 0 : W, y: H, vx: Math.cos(a) * v * dir, vy: -Math.sin(a) * v });
      }
    }
  } else if (FALLING.has(kind)) {
    n = n || 40;
    for (let i = 0; i < n; i++) add({ ch: pick(FX[kind]), s: rnd(3, 5.5) * u, x: rnd(0, W), y: rnd(-30, -5) * u, vx: 0, vy: rnd(.3, .9) * u,
      g: .004 * u, drag: .995, vr: rnd(-.03, .03), wob: rnd(.02, .05), sway: rnd(.2, .6) * u / 3, life: 360, delay: rnd(0, 60) | 0,
      glow: kind === 'matrix' ? '#33ff66' : null });
  } else {
    n = n || 34;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(1.5, 3.8) * u;
      add({ ch: pick(FX[kind]), s: rnd(3.5, 6.5) * u, x: W / 2, y: H / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5 * u,
        g: .05 * u, drag: .975, vr: rnd(-.08, .08), life: rnd(130, 190) | 0, delay: rnd(0, 6) | 0 });
    }
  }
  if (!raf) raf = requestAnimationFrame(frame);
}
// Encoge la alerta si no cabe (offsetWidth ignora la animación de entrada; el margen deja sitio a sombras y giros)
function fitAlert() {
  const f = document.getElementById('fit'), c = f?.firstChild;
  if (!c) return;
  const k = Math.min(1, innerWidth * .86 / c.offsetWidth, innerHeight * .8 / c.offsetHeight);
  f.style.transform = `translate(-50%, -50%) scale(${k})`;
}
// La meta ocupa el ancho; si con tu tamaño de letra no cabe (alto o título), se reduce la letra hasta que quepa
function fitGoal() {
  const w = document.getElementById('g');
  if (!w) return;
  w.style.fontSize = '';
  const title = w.querySelector('.row span');
  for (let f = parseFloat(getComputedStyle(w).fontSize), i = 0; i < 30 && f > 6; i++, f *= .93) {
    if (w.getBoundingClientRect().bottom <= innerHeight - 6 && title.scrollWidth <= title.clientWidth) break;
    w.style.fontSize = f * .93 + 'px';
  }
}
const refit = () => (isGoal ? fitGoal() : fitAlert());
addEventListener('resize', refit);
document.fonts.addEventListener?.('loadingdone', refit);
// Meta que sube sola: con "subir de X en X", al llegar se convierte en la siguiente.
const goalTarget = (v, target, step) => (!step || v < target ? target : target + step * (Math.floor((v - target) / step) + 1));
// "{user} ha enviado {gift} x{n}" → nodos de texto, con el usuario en negrita (nunca innerHTML: el nombre lo escribe cualquiera)
function fill(tpl, m) {
  const out = [];
  tpl.split(/(\{\w+\})/).forEach(p => {
    const k = /^\{(\w+)\}$/.exec(p)?.[1];
    if (k === 'user') out.push(el('b', '', m.user || 'Alguien'));
    else if (k) out.push(String({ gift: m.gift, n: m.n, diamonds: m.diamonds }[k] ?? ''));
    else if (p) out.push(p);
  });
  return out;
}

// ---------- ranking de regaladores (/meta?t=top): mismo aspecto que las metas ----------
const MEDAL = ['🥇', '🥈', '🥉'];
let topLeader = null;
function drawTop() {
  const t = cfg.widgets.top, s = cfg.widgets.goalStyle;
  const fx = theme(s, { '--gsize': s.size + 'px', '--size': s.size * 1.4 + 'px', '--gtext': s.text, '--gbg': s.bg + Math.round(s.bgAlpha * 2.55).toString(16).padStart(2, '0'), '--gc': '#ffc400' });
  const list = DEMO ? [['Ballena', 29999], ['Generoso', 1500], ['Fan_123', 320], ['LaModeradora', 99], ['Pepe_Gamer', 50]].map(([u, d]) => ({ u, d }))
    : Object.values(stats.top || {}).sort((a, b) => b.d - a.d);
  const rows = list.slice(0, Math.max(1, Math.min(10, t.count)));
  const sig = JSON.stringify([t, s, rows]);
  if (sig === drawTop.sig) return; // nada ha cambiado: no repintar (los temas animados se reiniciarían)
  drawTop.sig = sig;
  const w = el('div'); w.id = 'g'; w.className = 'top';
  const head = el('div', 'row'); head.append(el('span', '', t.title), el('span', '', '💎'));
  w.append(head);
  if (!rows.length) { const r = el('div', 'row pos'); r.append(el('span', '', 'El primer regalo aparecerá aquí'), el('span')); w.append(r); }
  rows.forEach((p, i) => { const r = el('div', 'row pos'); r.append(el('span', '', `${MEDAL[i] || i + 1 + '.'} ${p.u}`), el('span', '', p.d.toLocaleString('es'))); w.append(r); });
  box.replaceChildren(w);
  fitGoal();
  if (topLeader !== null && rows[0] && rows[0].u !== topLeader) burst(fx, 24); // celebra cuando alguien pasa a ser el número 1
  topLeader = rows[0]?.u ?? '';
}

// ---------- metas ----------
function drawGoal() {
  if (KEY === 'top') return drawTop();
  const g = cfg.widgets.goals[KEY], s = cfg.widgets.goalStyle;
  if (!g) return box.replaceChildren(el('p', '', 'Meta desconocida: ' + KEY));
  const a = Math.round(s.bgAlpha * 2.55).toString(16).padStart(2, '0');
  const fx = theme(s, { '--gsize': s.size + 'px', '--size': s.size * 1.4 + 'px', '--gtext': s.text, '--gbg': s.bg + a, '--gc': g.color });
  let v = (stats[KEY] || 0) + g.start;
  if (DEMO) v = Math.round(g.target * .6);
  const t = Math.max(1, goalTarget(v, g.target, g.step));
  let w = document.getElementById('g');
  if (!w) {
    w = el('div'); w.id = 'g';
    const row = el('div', 'row'), bar = el('div', 'bar');
    row.append(el('span'), el('span')); bar.append(el('div', 'fill')); w.append(row, bar);
    box.replaceChildren(w);
  }
  w.querySelector('.row').children[0].textContent = g.title;
  w.querySelector('.row').children[1].textContent = `${v.toLocaleString('es')} / ${t.toLocaleString('es')}`;
  w.querySelector('.fill').style.width = Math.min(100, v / t * 100) + '%';
  // celebración al cruzar el objetivo (o al saltar al siguiente), no al cargar la página
  const key = v >= t || t !== g.target ? t : 0;
  if (wasDone !== null && key && key !== wasDone) burst(fx, 24);
  wasDone = key;
  w.classList.toggle('done', v >= t);
  fitGoal();
}

// ---------- alertas (en cola, una detrás de otra) ----------
// Un solo widget para todo: los eventos de Twitch (si lo activas) usan las mismas alertas que los de TikTok.
const SAME_AS = { subgift: 'sub', bits: 'gift', powerup: 'gift' };
function wanted(m, test) {
  const a = cfg?.widgets.alerts[m.ev];
  const platform = m.p === 'tiktok' || (m.p === 'twitch' && cfg.widgets.style.twitch);
  return !!a && (test || (platform && a.on && (m.ev !== 'gift' || (m.diamonds || 0) >= a.min)));
}
function next() {
  if (busy || !queue.length) return;
  const m = queue.shift(), a = cfg.widgets.alerts[m.ev], s = cfg.widgets.style;
  busy = true;
  const fx = theme(s, { '--size': s.size + 'px', '--color': s.color, '--accent': s.accent });
  const card = el('div', 'al ' + s.anim);
  if (a.image && /\.json$/i.test(a.image)) { const l = el('div', 'lot'); card.append(l); lottieIn(l, media(a.image)); }
  else if (a.image && /\.(webm|mp4)$/i.test(a.image)) { const v = el('video'); Object.assign(v, { src: media(a.image), autoplay: true, muted: true, loop: true }); card.append(v); }
  else if (a.image) { const i = el('img'); i.src = media(a.image); card.append(i); }
  else if (m.ev === 'gift' && m.icon) { const i = el('img', 'gi'); i.src = m.icon; card.append(i); }
  else if (m.avatar) { const i = el('img', 'pic'); i.src = m.avatar; card.append(i); }
  else card.append(el('span', 'emo', EMOJI[m.ev]));
  const text = m.gift === 'bits' ? '{user} ha enviado {n} bits' : a.text; // los bits de Twitch no son «regalo x N»
  const line = el('div'); line.append(...fill(text, m)); card.append(line);
  const fit = el('div'); fit.id = 'fit'; fit.append(card);
  box.replaceChildren(fit);
  fitAlert();
  card.querySelectorAll('img').forEach(i => i.addEventListener('load', fitAlert)); // las imágenes cambian el tamaño al cargar
  card.querySelectorAll('video').forEach(v => v.addEventListener('loadedmetadata', fitAlert));
  burst(fx);
  if (a.sound) { const au = new Audio(media(a.sound)); au.volume = a.volume / 100; au.play().catch(() => {}); }
  hideTimer = setTimeout(() => {
    card.classList.add('out');
    setTimeout(() => { fit.remove(); busy = false; next(); }, 450);
  }, Math.max(1, a.duration) * 1000);
}
// Animaciones Lottie: el reproductor se carga la primera vez que hace falta (no pesa nada si no usas ninguna)
let lottieLib;
function lottieIn(box, src) {
  lottieLib ??= new Promise((ok, ko) => { const s = el('script'); s.src = '/lib/lottie.js'; s.onload = () => ok(window.lottie); s.onerror = ko; document.head.append(s); });
  lottieLib.then(L => { L.loadAnimation({ container: box, renderer: 'svg', loop: true, autoplay: true, path: src }); fitAlert(); }).catch(() => box.remove());
}
function push(m, test) { m = { ...m, ev: SAME_AS[m.ev] || m.ev }; if (!wanted(m, test)) return; if (queue.length < 50) queue.push(m); next(); }
window.preview = () => { queue = []; clearTimeout(hideTimer); busy = false; parts = []; push({ p: 'tiktok', ev: 'gift', user: 'Prueba', gift: 'Rosa', n: 5, diamonds: 5 }, true); }; // lo usa el panel al cambiar de tema

// ---------- conexión ----------
function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.cfg) cfg = d.cfg;
    if (d.stats) stats = d.stats;
    if (isGoal && cfg && (d.cfg || d.stats)) goalFrame ||= requestAnimationFrame(() => { goalFrame = 0; drawGoal(); }); // una vez por fotograma aunque lleguen muchos likes
    if (!isGoal && d.ev) push(d.ev);            // solo eventos nuevos (el historial que llega al conectar se ignora)
    if (!isGoal && d.alertTest) push(d.alertTest, true); // las pruebas salen aunque la alerta esté apagada
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
